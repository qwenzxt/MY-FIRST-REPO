<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | GreenShop</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-body">
  <div class="auth-box">
    <div class="auth-header">
      <h2><a href="#" class="auth-link active">Login</a> | <a href="#" class="auth-link">Register</a></h2>
      <button class="close-btn">×</button>
    </div>

    <p class="auth-sub">Enter your email and password to register.</p>

    <form class="auth-form">
      <input type="text" placeholder="Username" required />
      <input type="email" placeholder="Enter your email address" required />
      <div class="password-field">
        <input type="password" placeholder="Password" required />
        <img src="img/Hide.svg" alt="Show" />
      </div>
      <input type="password" placeholder="Confirm Password" required />
      <button type="submit" class="btn register-btn">Register</button>
    </form>

    <div class="divider">
      <span>Or register with</span>
    </div>

    <div class="social-login">
      <button class="social-btn google">
        <img src="img/google 1.png" alt="Google" /> Continue with Google
      </button>
      <button class="social-btn facebook">
        <img src="img/facebook 1.png" alt="Facebook" /> Continue with Facebook
      </button>
    </div>
  </div>
</body>
</html>
